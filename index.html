<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeusKart</title>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<script src="config-teuskart.js"></script>
<style>
body{margin:0;font-family:sans-serif;color:#fff}
#start{position:fixed;inset:0;z-index:20;background:#0a2540;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
#start{background-size:cover;background-position:center}
#logo{max-width:60%;max-height:30vh;margin-bottom:16px}
#go{font-size:1.2rem;padding:14px 30px;border:0;border-radius:10px;background:#00e5a0}
#hint{position:fixed;top:12px;left:0;right:0;z-index:5;text-align:center;text-shadow:0 0 4px #000}
#panel{display:none;position:fixed;left:0;right:0;bottom:0;max-height:70vh;overflow:auto;z-index:10;background:rgba(10,37,64,.92);padding:12px 16px 20px;border-radius:16px 16px 0 0}
#panel img,#panel video,#panel canvas{width:100%;max-height:45vh;object-fit:contain;border-radius:8px}
#panel input{width:100%}
#sb,#vc{display:flex;gap:8px;justify-content:center;margin:8px 0}
#sb button,#vc button{padding:8px 14px;border:0;border-radius:8px;font-size:1rem}
.a-enter-vr{display:none!important}
.a-canvas{touch-action:none}
#x{float:right;border:0;background:#fff3;color:#fff;font-size:1.2rem;border-radius:50%;width:36px;height:36px}
</style></head><body>
<div id="start"><img id="logo" style="display:none" alt=""><h1 id="ttl"></h1><p id="sub"></p><button id="go">Tap to start</button><p id="msg"></p></div>
<button id="rl" style="display:none;position:fixed;top:45%;left:50%;transform:translateX(-50%);z-index:40;padding:14px 22px;font-size:1.1rem;border:0;border-radius:10px;background:#fff">Taking too long. Tap to reload</button>
<div id="dbg" style="position:fixed;left:6px;bottom:4px;z-index:30;font:12px monospace;color:#0f0;text-shadow:0 0 3px #000"></div>
<div id="hint">Point your camera at a picture marked with 👁</div>
<div id="panel"><button id="x">✕</button><h3 id="pt"></h3><div id="pc"></div><p id="pcap"></p></div>

<a-scene mindar-image="imageTargetSrc:./targets-teuskart.mind;autoStart:false;uiScanning:no;uiLoading:no;filterMinCF:0.0001;filterBeta:10;missTolerance:10"
 color-space="sRGB" vr-mode-ui="enabled:false" device-orientation-permission-ui="enabled:false">
 <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>
</a-scene>

<script>
const $=id=>document.getElementById(id), scene=document.querySelector('a-scene');
let cur=-1, raf, tmr; const ovs=[];
const dbg=m=>$('dbg').textContent=m;
$('ttl').textContent=CONFIG.title; $('sub').textContent=CONFIG.subtitle;
// loading screen pictures (set in config.js: logo, background)
if(CONFIG.logo){const l=$('logo');l.onerror=()=>l.style.display='none';l.src=CONFIG.logo;l.style.display='block';}
if(CONFIG.background)$('start').style.backgroundImage=`linear-gradient(rgba(10,37,64,.55),rgba(10,37,64,.55)),url(${CONFIG.background})`;
let armed=false;
scene.addEventListener('arReady',()=>{armed=true;$('start').style.display='none';$('rl').style.display='none';dbg('Camera ready. Looking for targets...');});
scene.addEventListener('arError',()=>{$('msg').textContent='Camera blocked or failed. Reload and allow the camera.';dbg('ERROR: AR could not start (check targets.mind and camera permission)');});

// For every target: an image plane, a video plane and a 3D model slot, all on top of the scanned picture
function build(){
  ['ambient','directional'].forEach(ty=>{const l=document.createElement('a-light');l.setAttribute('type',ty);l.setAttribute('intensity',ty==='ambient'?1.5:1);l.setAttribute('position','1 2 2');scene.appendChild(l);});
  CONFIG.targets.forEach((t,i)=>{
    const e=document.createElement('a-entity'); e.setAttribute('mindar-image-target','targetIndex:'+i);
    const v=document.createElement('video'); v.id='vid_'+i; v.loop=true; v.muted=true; v.setAttribute('playsinline',''); v.setAttribute('crossorigin','anonymous');
    v.style.cssText='position:fixed;bottom:0;left:0;width:2px;height:2px;opacity:.01;pointer-events:none'; document.body.appendChild(v);
    const mk=()=>{const p=document.createElement('a-plane');p.setAttribute('width','1');p.setAttribute('height','0.6');p.setAttribute('visible','false');e.appendChild(p);return p;};
    const img=mk(), vid=mk(); vid.setAttribute('material',{shader:'flat',src:'#vid_'+i});
    const mdl=document.createElement('a-entity'); mdl.setAttribute('visible','false'); e.appendChild(mdl);
    ovs[i]={img,vid,mdl,v,ry:0,rx:0,zoom:1,fit:1,base:.6,spin:false,mixer:null,actions:[],fwd:true,active:false};
    e.addEventListener('targetFound',()=>{dbg('FOUND target '+(i+1));show(i);if(vid.getAttribute('visible'))v.play().catch(()=>{});});
    e.addEventListener('targetLost',()=>{dbg('lost target '+(i+1));v.pause();});
    scene.appendChild(e);
  });
  startLoop();
}
// The start button stays disabled until A-Frame has finished loading (this was the cause of "stuck on loading" on a first visit)
$('go').disabled=true; $('go').textContent='Loading...';
const enable=()=>{$('go').disabled=false;$('go').textContent='Tap to start';};
if(scene.hasLoaded)enable(); else scene.addEventListener('loaded',enable,{once:true});
$('rl').onclick=()=>location.reload();
async function startAR(){
  const sys=scene.systems['mindar-image-system'];
  for(let n=1;n<=3;n++){
    try{ await sys.start(); return; }
    catch(err){ dbg('Retrying ('+n+'/3): '+err); try{sys.stop();}catch(e){} await new Promise(r=>setTimeout(r,1000)); }
  }
  dbg('Could not start. Tap reload.'); $('rl').style.display='block';
}
$('go').onclick=async()=>{
  $('go').style.display='none'; $('msg').textContent='Starting camera...'; dbg('Starting...');
  build(); await new Promise(r=>setTimeout(r,300));
  setTimeout(()=>{ if(!armed)$('rl').style.display='block'; },15000);   // still loading after 15 s -> show reload button
  startAR();
};
function hideAll(i){const o=ovs[i];if(!o)return;o.tk=null;o.img.setAttribute('visible',false);o.vid.setAttribute('visible',false);o.mdl.setAttribute('visible',false);o.mdl.removeAttribute('gltf-model');o.v.pause();o.mixer=null;o.actions=[];o.spin=false;o.ry=0;o.rx=0;o.zoom=1;o.fwd=true;o.fit=1;o.active=false;}
$('x').onclick=()=>{cancelAnimationFrame(raf);clearTimeout(tmr);if(cur>=0)hideAll(cur);$('panel').style.display='none';$('pc').innerHTML='';cur=-1;$('hint').style.display='block';};

function ovShow(i,it){
  const o=ovs[i], tk=o.tk={};
  if(it.type==='image'){
    const im=new Image();
    im.onload=()=>{if(o.tk!==tk)return;o.img.setAttribute('height',im.naturalHeight/im.naturalWidth);o.img.setAttribute('material',{shader:'flat',src:it.src,transparent:true});o.img.setAttribute('visible',true);};
    im.onerror=()=>dbg('IMAGE NOT FOUND: '+it.src); im.src=it.src;
  } else if(it.type==='video'){
    o.v.onloadedmetadata=()=>{if(o.tk!==tk)return;o.vid.setAttribute('height',o.v.videoHeight/o.v.videoWidth);o.vid.setAttribute('visible',true);};
    o.v.onerror=()=>dbg('VIDEO NOT FOUND: '+it.src);
    o.v.src=it.src; o.v.muted=true; o.v.play().catch(()=>{});
  } else if(it.type==='model'){
    o.base=it.scale||0.6; o.spin=!!it.spin; o.active=true;
    o.mdl.addEventListener('model-error',()=>dbg('MODEL NOT FOUND: '+it.src),{once:true});
    o.mdl.addEventListener('model-loaded',ev=>{
      if(o.tk!==tk)return; fitModel(o,ev.detail.model); const an=ev.detail.model.animations||[];
      if(an.length){o.mixer=new AFRAME.THREE.AnimationMixer(ev.detail.model);o.actions=an.map(c=>o.mixer.clipAction(c));const b=$('m2');if(b)b.style.display='';}
    },{once:true});
    o.mdl.setAttribute('position',`0 ${it.y||0} 0.1`); o.mdl.setAttribute('gltf-model',it.src); o.mdl.setAttribute('visible',true);
  }
}
// Centers the model on its own middle (so it spins around itself) and auto-sizes it
function fitModel(o,model){
  try{
    const T=AFRAME.THREE, par=model.parent;
    if(par)par.remove(model);            // measure the model alone (ignore the AR tracking matrix)
    model.updateMatrixWorld(true);
    const box=new T.Box3().setFromObject(model);
    if(par)par.add(model);
    if(box.isEmpty()){dbg('Model has no visible geometry');return;}
    const c=box.getCenter(new T.Vector3()), sz=box.getSize(new T.Vector3());
    const mx=Math.max(sz.x,sz.y,sz.z);
    if(!isFinite(mx)||mx<=0){dbg('Model size problem');return;}
    model.position.sub(c);               // pivot = middle of the model
    o.fit=1/mx;                          // biggest side = 1 poster width
    const g=o.mdl.object3D; g.position.set(g.position.x,g.position.y,0.02+sz.z*o.fit*o.base/2);
    dbg('Model OK, raw size '+mx.toFixed(3));
  }catch(err){dbg('Model fit error: '+err.message);}
}
// ---- 3D model controls: spin, drag-to-rotate, pinch-to-zoom, play built-in animation ----
function modelUI(i){
  const o=ovs[i];
  $('gi').innerHTML='<small>Drag the model to rotate · pinch to zoom</small>';
  $('vc').innerHTML='<button id="m1">↻ Spin</button><button id="m2" style="display:none">▶ Animation</button><button id="m3">⟲ Reset</button>';
  $('m1').onclick=()=>{o.spin=!o.spin;$('m1').textContent=o.spin?'⏸ Stop spin':'↻ Spin';};
  $('m2').onclick=()=>{const T=AFRAME.THREE;o.actions.forEach(a=>{a.setLoop(T.LoopOnce,1);a.clampWhenFinished=true;a.reset();if(o.fwd)a.timeScale=1;else{a.timeScale=-1;a.time=a.getClip().duration;}a.play();});o.fwd=!o.fwd;$('m2').textContent=o.fwd?'▶ Animation':'◀ Reverse';};
  $('m3').onclick=()=>{o.ry=0;o.rx=0;o.zoom=1;o.spin=false;o.fwd=true;$('m1').textContent='↻ Spin';$('m2').textContent='▶ Animation';o.actions.forEach(a=>a.stop());if(o.mixer)o.mixer.update(0);};
}
function startLoop(){
  let last=performance.now();
  (function f(now){
    const dt=Math.min((now-last)/1000,0.1); last=now;
    ovs.forEach(o=>{ if(!o||!o.active)return; if(o.spin)o.ry+=dt*1.2; if(o.mixer)o.mixer.update(dt);
      const m=o.mdl.object3D; m.rotation.set(o.rx,o.ry,0); const sc=o.base*o.zoom*o.fit; if(isFinite(sc)&&sc>0)m.scale.setScalar(sc); });
    requestAnimationFrame(f);
  })(last);
}
const ptr=new Map();
window.addEventListener('pointerdown',e=>{ if(e.target.closest&&e.target.closest('#panel,#start'))return; ptr.set(e.pointerId,{x:e.clientX,y:e.clientY}); });
window.addEventListener('pointermove',e=>{
  const p=ptr.get(e.pointerId); if(!p||cur<0)return; const o=ovs[cur]; if(!o||!o.active)return;
  if(ptr.size===1){ o.ry+=(e.clientX-p.x)*0.012; o.rx=Math.max(-1.2,Math.min(1.2,o.rx+(e.clientY-p.y)*0.012)); }
  else if(ptr.size===2){ const q=[...ptr.entries()].find(([id])=>id!==e.pointerId)[1];
    const b=Math.hypot(p.x-q.x,p.y-q.y), a=Math.hypot(e.clientX-q.x,e.clientY-q.y); if(b>0)o.zoom=Math.max(.3,Math.min(4,o.zoom*a/b)); }
  ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
});
['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,e=>ptr.delete(e.pointerId)));
function panelShow(it){
  $('gi').innerHTML= it.type==='image'?`<img src="${it.src}">`
   : it.type==='video'?`<video src="${it.src}" controls autoplay muted loop playsinline></video>`
   : `<model-viewer src="${it.src}" camera-controls auto-rotate style="width:100%;height:40vh"></model-viewer>`;
}
function itemsOf(t){
  if(t.type==='gallery')return t.items;
  if(t.type==='slideshow')return t.slides.map((s,k)=>({type:'image',src:s,caption:t.captions&&t.captions[k]}));
  return [t];   // single image / video / model
}
function gallery(i,t,box){
  const items=itemsOf(t), n=items.length, ov=t.overlay!==false; let k=0, playing=!!t.auto&&n>1;
  box.innerHTML='<div id="gi"></div><div id="vc"></div>'+(n>1?`<div id="sb"><button id="pv">◀ Back</button><button id="pp"></button><button id="nx">Next ▶</button></div><input type="range" id="sr" min="0" max="${n-1}" value="0">`:'')+'<div id="sc"></div>';
  const draw=()=>{
    const it=items[k]; hideAll(i); $('gi').innerHTML=''; $('vc').innerHTML='';
    if(ov){ if(it.type==='model')modelUI(i); ovShow(i,it); if(it.type==='model'&&ovs[i].spin)$('m1').textContent='⏸ Stop spin';
      if(it.type==='video'){ $('vc').innerHTML='<button id="vp">⏸ / ▶</button><button id="vm">🔇 / 🔊</button>';
        $('vp').onclick=()=>{const v=ovs[i].v;v.paused?v.play():v.pause();}; $('vm').onclick=()=>{ovs[i].v.muted=!ovs[i].v.muted;}; }
    } else panelShow(it);
    $('sc').textContent=it.caption||(n>1?(k+1)+' / '+n:'');
  };
  if(n>1){
    const go=j=>{k=(j+n)%n;$('sr').value=k;draw();};
    const tick=()=>{if(playing)tmr=setTimeout(()=>{go(k+1);tick();},(items[k].seconds||t.seconds||3)*1000);};
    const set=p=>{playing=p;$('pp').textContent=p?'⏸ Pause':'▶ Play';clearTimeout(tmr);tick();};
    $('pv').onclick=()=>{set(false);go(k-1);}; $('nx').onclick=()=>{set(false);go(k+1);};
    $('sr').oninput=e=>{set(false);go(+e.target.value);}; $('pp').onclick=()=>set(!playing);
    set(playing);
  }
  draw();
}
function show(i){
  if(i===cur)return; if(cur>=0)hideAll(cur); cur=i; cancelAnimationFrame(raf); clearTimeout(tmr);
  const t=CONFIG.targets[i], box=$('pc'); $('pt').textContent=t.title; $('pcap').textContent='';
  if(t.type==='simulator'){simulator(box);$('pcap').textContent=t.caption||'';} else gallery(i,t,box);
  $('panel').style.display='block'; $('hint').style.display='none';
}

function simulator(box){
  let h='';
  SIM.sliders.forEach(s=>h+=`<label>${s.label}: <b id="v_${s.id}">${s.value}</b> ${s.unit}</label><input type="range" id="s_${s.id}" min="${s.min}" max="${s.max}" step="${s.step}" value="${s.value}">`);
  box.innerHTML=h+'<canvas id="cv" width="600" height="340"></canvas>';
  const run=()=>{
    const v={}; SIM.sliders.forEach(s=>{v[s.id]=+$('s_'+s.id).value;$('v_'+s.id).textContent=v[s.id];});
    const pts=SIM.model(v); let n=0; cancelAnimationFrame(raf);
    (function step(){n+=4;plot(pts.slice(0,n));if(n<pts.length)raf=requestAnimationFrame(step);})();
  };
  SIM.sliders.forEach(s=>$('s_'+s.id).oninput=run); run();
}
function plot(p){
  const c=$('cv'),g=c.getContext('2d'),W=c.width,H=c.height,m=50;
  g.clearRect(0,0,W,H);g.strokeStyle='#fff';g.fillStyle='#fff';g.font='16px sans-serif';g.lineWidth=1;
  g.beginPath();g.moveTo(m,10);g.lineTo(m,H-m);g.lineTo(W-10,H-m);g.stroke();
  g.fillText(SIM.xlabel,W/2-30,H-12);g.save();g.translate(16,H/2+20);g.rotate(-Math.PI/2);g.fillText(SIM.ylabel,0,0);g.restore();
  g.strokeStyle='#00e5a0';g.lineWidth=3;g.beginPath();
  p.forEach((q,k)=>{const x=m+q.x/SIM.xmax*(W-m-10),y=(H-m)-q.y/SIM.ymax*(H-m-10);k?g.lineTo(x,y):g.moveTo(x,y);});
  g.stroke();
}
</script></body></html>
